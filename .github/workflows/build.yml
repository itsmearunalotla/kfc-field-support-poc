name: Build and Checks

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: API tests and Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run API tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/api-test-output.txt"
          {
            echo "### API test results"
            echo '~~~text'
            cat "$RUNNER_TEMP/api-test-output.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform providers
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate

      - name: Initialize bootstrap Terraform
        run: terraform -chdir=infra/bootstrap-state init -backend=false -input=false

      - name: Validate bootstrap Terraform
        run: terraform -chdir=infra/bootstrap-state validate

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: false
          # Keep only documented POC exceptions non-blocking. Findings remain visible.
          soft_fail_on: "CKV_AZURE_33,CKV_AZURE_59,CKV_AZURE_206,CKV_AZURE_139,CKV_AZURE_167,CKV_AZURE_165,CKV_AZURE_233,CKV_AZURE_166,CKV_AZURE_237,CKV_AZURE_164,CKV2_AZURE_38,CKV2_AZURE_41,CKV2_AZURE_40,CKV2_AZURE_33,CKV2_AZURE_21,CKV2_AZURE_1"

      - name: Scan configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
