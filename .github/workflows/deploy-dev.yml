name: Deploy EKFC Field Support API

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-support-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Run checks
    uses: ./.github/workflows/build.yml

  plan:
    name: Plan Azure changes
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote state
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP || 'ekfc-poc-tfstate-rg' }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=field-support/dev.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=${{ vars.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Create and publish plan
        id: plan
        run: |
          terraform -chdir=infra plan -input=false -var-file=dev.tfvars -out=tfplan
          terraform -chdir=infra show -no-color tfplan | tee "$RUNNER_TEMP/plan.txt"
          {
            echo "## Terraform plan for dev"
            echo '~~~text'
            cat "$RUNNER_TEMP/plan.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          fingerprint=$(terraform -chdir=infra show -json tfplan | jq -S \
            '{resource_changes: [.resource_changes[]? | {address, change}], output_changes: .output_changes}' \
            | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

  apply:
    name: Approve and apply Terraform plan
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev-apply
    permissions:
      contents: read
      id-token: write
    outputs:
      registry_name: ${{ steps.outputs.outputs.registry_name }}
      registry_login_server: ${{ steps.outputs.outputs.registry_login_server }}
      app_name: ${{ steps.outputs.outputs.container_app_name }}
      resource_group: ${{ steps.outputs.outputs.resource_group_name }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      EXPECTED_PLAN_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote state
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP || 'ekfc-poc-tfstate-rg' }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=field-support/dev.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=${{ vars.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Recheck and apply reviewed plan
        run: |
          terraform -chdir=infra plan -input=false -var-file=dev.tfvars -out=tfplan
          fingerprint=$(terraform -chdir=infra show -json tfplan | jq -S \
            '{resource_changes: [.resource_changes[]? | {address, change}], output_changes: .output_changes}' \
            | sha256sum | cut -d ' ' -f 1)

          if [ "$fingerprint" != "$EXPECTED_PLAN_FINGERPRINT" ]; then
            echo "Terraform plan changed after review. Review the new plan and run again."
            exit 1
          fi

          terraform -chdir=infra apply -input=false -auto-approve tfplan

      - name: Export Terraform outputs
        id: outputs
        run: |
          echo "registry_name=$(terraform -chdir=infra output -raw registry_name)" >> "$GITHUB_OUTPUT"
          echo "registry_login_server=$(terraform -chdir=infra output -raw registry_login_server)" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$(terraform -chdir=infra output -raw container_app_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform -chdir=infra output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy API
    needs: apply
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build API image
        env:
          REGISTRY_NAME: ${{ needs.apply.outputs.registry_name }}
          REGISTRY_LOGIN_SERVER: ${{ needs.apply.outputs.registry_login_server }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az acr login --name "$REGISTRY_NAME"
          APP_VERSION=$(node -p "require('./package.json').version")
          docker build \
            --build-arg "APP_VERSION=$APP_VERSION" \
            --build-arg "APP_COMMIT=$IMAGE_TAG" \
            --tag "$REGISTRY_LOGIN_SERVER/field-support-api:$IMAGE_TAG" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ needs.apply.outputs.registry_login_server }}/field-support-api:${{ github.sha }}"
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Push image to ACR
        env:
          REGISTRY_LOGIN_SERVER: ${{ needs.apply.outputs.registry_login_server }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$REGISTRY_LOGIN_SERVER/field-support-api:$IMAGE_TAG"

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy API image
        env:
          REGISTRY_LOGIN_SERVER: ${{ needs.apply.outputs.registry_login_server }}
          RESOURCE_GROUP: ${{ needs.apply.outputs.resource_group }}
          CONTAINER_APP: ${{ needs.apply.outputs.app_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY_LOGIN_SERVER/field-support-api:$IMAGE_TAG"

      - name: Verify deployment and ticket storage
        env:
          RESOURCE_GROUP: ${{ needs.apply.outputs.resource_group }}
          CONTAINER_APP: ${{ needs.apply.outputs.app_name }}
        run: |
          URL=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          for attempt in {1..24}; do
            INFO=$(curl --fail --silent --max-time 5 "https://$URL/api/info" || true)
            if echo "$INFO" | jq --exit-status \
              --arg commit "$GITHUB_SHA" \
              '.commit == $commit and .environment == "dev"' > /dev/null 2>&1; then
              TICKETS=$(curl --fail --silent --max-time 5 "https://$URL/api/tickets" || true)
              if echo "$TICKETS" | jq --exit-status '.tickets | type == "array"' > /dev/null 2>&1; then
                break
              fi
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "API revision or ticket storage did not become ready."
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error "https://$URL/health"
          echo "$INFO" | jq .
          {
            echo "API: https://$URL"
            echo "Health: https://$URL/health"
            echo "Info: https://$URL/api/info"
            echo "Tickets: https://$URL/api/tickets"
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
