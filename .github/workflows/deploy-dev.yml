name: Deploy EKFC Field Support API

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: read

# Prevent two deployments to the same branch from running at once.
concurrency:
  group: field-support-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the reusable tests and checks before touching Azure.
  build:
    name: Run build and checks
    uses: ./.github/workflows/build.yml

  # Provision or update Azure resources, then pass their names to the deploy job.
  infra:
    name: Provision Azure infrastructure
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      registry_name: ${{ steps.outputs.outputs.registry_name }}
      registry_login_server: ${{ steps.outputs.outputs.registry_login_server }}
      app_name: ${{ steps.outputs.outputs.container_app_name }}
      resource_group: ${{ steps.outputs.outputs.resource_group_name }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Connect Terraform to remote state
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP || 'ekfc-poc-tfstate-rg' }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=field-support/dev.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=${{ vars.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Create Terraform plan
        run: terraform -chdir=infra plan -input=false -var-file=dev.tfvars -out=tfplan

      - name: Apply Terraform plan
        run: terraform -chdir=infra apply -input=false -auto-approve tfplan

      - name: Export Azure resource names
        id: outputs
        run: |
          echo "registry_name=$(terraform -chdir=infra output -raw registry_name)" >> "$GITHUB_OUTPUT"
          echo "registry_login_server=$(terraform -chdir=infra output -raw registry_login_server)" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$(terraform -chdir=infra output -raw container_app_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform -chdir=infra output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

  # Build the API image, push it to ACR, then update the Container App.
  app:
    name: Build and deploy API
    needs: infra
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build API container image
        env:
          REGISTRY_NAME: ${{ needs.infra.outputs.registry_name }}
          REGISTRY_LOGIN_SERVER: ${{ needs.infra.outputs.registry_login_server }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az acr login --name "$REGISTRY_NAME"
          APP_VERSION=$(node -p "require('./package.json').version")
          docker build \
            --build-arg "APP_VERSION=$APP_VERSION" \
            --build-arg "APP_COMMIT=$IMAGE_TAG" \
            --tag "$REGISTRY_LOGIN_SERVER/field-support-api:$IMAGE_TAG" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ needs.infra.outputs.registry_login_server }}/field-support-api:${{ github.sha }}"
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Push image to ACR
        env:
          REGISTRY_LOGIN_SERVER: ${{ needs.infra.outputs.registry_login_server }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$REGISTRY_LOGIN_SERVER/field-support-api:$IMAGE_TAG"

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy image to Container Apps
        env:
          REGISTRY_LOGIN_SERVER: ${{ needs.infra.outputs.registry_login_server }}
          RESOURCE_GROUP: ${{ needs.infra.outputs.resource_group }}
          CONTAINER_APP: ${{ needs.infra.outputs.app_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY_LOGIN_SERVER/field-support-api:$IMAGE_TAG"

      - name: Check API health and publish URLs
        env:
          RESOURCE_GROUP: ${{ needs.infra.outputs.resource_group }}
          CONTAINER_APP: ${{ needs.infra.outputs.app_name }}
        run: |
          URL=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          for attempt in {1..12}; do
            if curl --fail --silent --show-error "https://$URL/health"; then
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "API health check failed after 12 attempts."
              exit 1
            fi

            sleep 10
          done

          INFO=$(curl --fail --silent --show-error "https://$URL/api/info")
          echo "$INFO" | jq .
          echo "$INFO" | jq --exit-status \
            --arg commit "$GITHUB_SHA" \
            '.commit == $commit and .environment == "dev"

          {
            echo "Deployed API: https://$URL"
            echo "Health: https://$URL/health"
            echo "Info: https://$URL/api/info"
            echo "Tickets: https://$URL/api/tickets"
            echo "Deployed commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"